name: Build Check

# Run for every PR: a required check must not be skipped by a paths filter.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install application and fixture-test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependency compatibility
        run: python -m pip check
      - name: Test Python API and browser state with synthetic data
        run: npm test
      - name: Install Chromium for isolated browser fixtures
        run: python -m playwright install --with-deps chromium
      - name: Test real browser refresh behavior with synthetic APIs
        run: python tests/browser_refresh.py
      - name: Compile application and Vercel entrypoint
        run: python -m compileall -q src api
      - name: Validate maintenance opt-in
        working-directory: .
        run: |
          python3 .github/scripts/branch-heartbeat.py --validate-config .github/branch-heartbeat.json
          python3 -m compileall -q .github/scripts
