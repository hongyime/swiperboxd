name: Heartbeat

# Opt-in replacement for default-branch timestamp commits. The activity branch
# contains no application files and disables its own Vercel deployments.
# Keep the schedule on the default branch; shared sync staggers the minute.
on:
  schedule:
    - cron: "1 9 * * 1"
  workflow_dispatch:

concurrency:
  group: branch-heartbeat
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heartbeat:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record repository activity without deploying the app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/branch-heartbeat.py
