name: Swiperboxd Tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'requirements.txt', 'pyproject.toml', 'package.json', '.github/workflows/swiper-tests.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'requirements.txt', 'pyproject.toml', 'package.json', '.github/workflows/swiper-tests.yml']

permissions:
  contents: read

concurrency:
  group: swiper-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: npm run lint
